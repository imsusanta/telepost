name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telepost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/telepost_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Forbid hardcoded JWTs in src
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' src; then
            echo "Hardcoded JWTs are not allowed under src/"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc -b

      - name: Unit tests
        run: npm run test:unit

      - name: Database integration tests
        run: npm run test:integration

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check Edge Functions
        run: npm run check:functions

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "dummy-key-for-ci"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI end-to-end tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "dummy-key-for-ci"
          CI: "true"
