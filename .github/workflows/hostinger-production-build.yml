name: Build Hostinger production files

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hostinger-production-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Vite source entry
        run: cp index.source.html index.html

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Publish production files
        run: |
          rm -rf assets
          rsync -a dist/ ./
          rm -rf dist

      - name: Commit production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production bundle is already current."
            exit 0
          fi
          git commit -m "deploy: publish Hostinger production build [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
