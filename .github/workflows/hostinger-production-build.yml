name: Build Hostinger production files

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hostinger-production-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          # Publishable anon credentials only. Required now that src/ does not embed a JWT fallback.
          VITE_SUPABASE_URL: https://wpkxbrdgktmwnowvmwue.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indwa3hicmRna3Rtd25vd3Ztd3VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxMTkyNTQsImV4cCI6MjA4MDY5NTI1NH0.TR7cBNS0w6REoI2cKgcc3pubgIrY94IWoiXAWiy3X3M
          VITE_SUPABASE_PROJECT_ID: wpkxbrdgktmwnowvmwue

      - name: Publish bundle to hostinger-production
        env:
          HOSTINGER_BRANCH: hostinger-production
        run: |
          # Hostinger Git hosting should track hostinger-production, not main.
          # main stays source-only (no minified assets/ commit).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BUILD_DIR="$(mktemp -d)"
          rsync -a dist/ "$BUILD_DIR/"

          git fetch origin "$HOSTINGER_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${HOSTINGER_BRANCH}"; then
            git checkout -B "$HOSTINGER_BRANCH" "origin/${HOSTINGER_BRANCH}"
          else
            git checkout --orphan "$HOSTINGER_BRANCH"
            git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a "$BUILD_DIR/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "Hostinger production bundle is already current."
            exit 0
          fi
          git commit -m "deploy: publish Hostinger production build"
          git push origin "HEAD:${HOSTINGER_BRANCH}"
