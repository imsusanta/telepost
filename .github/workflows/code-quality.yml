name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/code-quality-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Forbid hardcoded JWTs in src
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' src; then
            echo "Hardcoded JWTs are not allowed under src/"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "dummy-key-for-ci"
